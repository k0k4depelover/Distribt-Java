networks:
  public-net:
    driver: bridge
  
  internal-net:
    driver: bridge
    internal: true


services:
  eureka-server:
    networks:
      - internal-net
      - public-net
    build: ./eureka-server
    ports:
      - 8761:8761

  
  api-gateway:
    networks:
      - public-net
      - internal-net
    build: ./api-gateway
    ports:
      - 8090:8090
    depends_on:
      - eureka-server
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka


  api-gateway-teenants:
    networks:
      - public-net
      - internal-net
    build: ./api-gateway-teenants
    #ports:
    #- 9090:9090
    depends_on:
      - eureka-server
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka


  msvc-suscriptions:
    networks:
      - internal-net
    build: ./msvc-suscriptions
    #ports:
    #  - 9001:9001
    depends_on:
      - eureka-server
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

  msvc-email:
    networks:
      - public-net
      - internal-net
    build: ./msvc-email
    dns:
      - 8.8.8.8
      - 1.1.1.1
    #ports:
    #  - 9002:9002
    
    depends_on:
      - eureka-server
    
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

    
  postgres-teenants:
    image: postgres:16-alpine
    container_name: postgres-db-teenants
    environment:
      - POSTGRES_DB=teenants-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=PASSWORD
    networks:
      - internal-net


  postgres-suscriptions:
    image: postgres:16-alpine
    container_name: postgres-db-subs
    environment:
      - POSTGRES_DB=suscriptions-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=s3cur3p4SSw0rd

    networks:
      - internal-net
    ports:
      - 5432:5432
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    networks:
      - internal-net
      
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  redis-rl:
    image: redis:alpine
    container_name: redis-rl

    networks:
      - internal-net

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

  portainer:
    networks: 
      - public-net
    image: portainer/portainer-ce:latest
    #ports: 
    #  - "9000:9000"

    volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - portainer_data:/data

    restart: always

volumes:
    portainer_data:
    redis-data: