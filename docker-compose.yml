networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true

services:
  eureka-server-ds:
    networks:
      - internal-net
      - public-net
    build: ./eureka-server
    ports:
      - 8761:8761
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    networks:
      - public-net
      - internal-net
    build: ./api-gateway
    ports:
      - 8090:8090
    depends_on:
      eureka-server-ds:
        condition: service_healthy
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server-ds:8761/eureka

  api-gateway-teenants:
    networks:
      - public-net
      - internal-net
    build: ./api-gateway-teenants
    ports:
      - 9090:9090
    depends_on:
      postgres-teenants:
        condition: service_healthy  # ← AGREGA ESTO
      eureka-server-ds:
        condition: service_healthy
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server-ds:8761/eureka

  msvc-suscriptions:
    networks:
      - internal-net
    build: ./msvc-suscriptions
    depends_on:
      postgres-suscriptions:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy  # ← AGREGA ESTO
      eureka-server-ds:
        condition: service_healthy
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server-ds:8761/eureka

  msvc-email:
    networks:
      - internal-net
    build: ./msvc-email
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      rabbitmq:
        condition: service_healthy  # ← AGREGA ESTO
      eureka-server-ds:
        condition: service_healthy
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server-ds:8761/eureka

  postgres-teenants:
    image: postgres:16-alpine
    container_name: postgres-db-teenants
    environment:
      - POSTGRES_DB=teenants-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=PASSWORD
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-suscriptions:
    image: postgres:16-alpine
    container_name: postgres-db-subs
    environment:
      - POSTGRES_DB=suscriptions-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=s3cur3p4SSw0rd
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    networks:
      - internal-net
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-rl:
    image: redis:alpine
    container_name: redis-rl
    networks:
      - internal-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  portainer:
    networks:
      - public-net
    image: portainer/portainer-ce:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

volumes:
  portainer_data:
  redis-data: